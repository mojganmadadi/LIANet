experiment_name: bfpbinary_terramind_unfrozen_final
base_train_config: BFPBinary_TerraTorch_TerraMind

output_root: ./Results/Finetuning_Automated
python_executable: python

tiles: [T31TFM, T32ULU]
task_template: BFPBinary_local_{tile}
folds: [0]
seeds: [42]

train:
  enabled: true
  skip_existing: true
  pass_val_folds: false
  extra_overrides:
    epochs: 20
    warmup_epochs: 0
    validate_every_n_epochs: 1
    plot_every_n_epochs: 999
    num_workers: 8
    gpu_id: 0
    checkpoint_metric: jaccard_macro                                                                                                                                                                
    checkpoint_mode: max   
  variants:
    - name: lr1e-4_bs32
      overrides:
        learningrate: 0.0001
        batchsize: 32
        gradient_accumulation_steps: 1
    - name: lr5e-5_bs32
      overrides:
        learningrate: 0.00005
        batchsize: 32
        gradient_accumulation_steps: 1
    - name: lr5e-4_bs32
      overrides:
        learningrate: 0.0005
        batchsize: 32
        gradient_accumulation_steps: 1

evaluation:
  enabled: true
  checkpoint_name: best.pt
  batchsize: 4
  num_workers: 4
  include_self_region: false
  device: auto

summary:
  primary_metric: jaccard_macro

smoke_test:
  max_batches: 1