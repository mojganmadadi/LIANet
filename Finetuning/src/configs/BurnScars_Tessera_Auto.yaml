experiment_name: burnscars_tessera_cross_region_final_final
base_train_config: BurnScars_TerraTorch_Tessera

output_root: ./Results/Finetuning_Automated
python_executable: python

tiles: [T11SMT, T16REV]
task_template: BurnScars_local_{tile}
folds: [0]
seeds: [42]

train:
  enabled: true
  skip_existing: true
  pass_val_folds: false
  extra_overrides:
    epochs: 1
    warmup_epochs: 0
    validate_every_n_epochs: 1
    plot_every_n_epochs: 999
    num_workers: 0
    gpu_id: 0
    checkpoint_metric: jaccard_macro                                                                                                                                                                
    checkpoint_mode: max   
  variants:
    - name: lr1e-4_bs32
      overrides:
        learningrate: 0.0001
        batchsize: 1
        gradient_accumulation_steps: 32
    - name: lr1e-5_bs32
      overrides:
        learningrate: 0.00001
        batchsize: 1
        gradient_accumulation_steps: 32

evaluation:
  enabled: true
  checkpoint_name: best.pt
  batchsize: 2
  num_workers: 0
  include_self_region: false
  device: auto

summary:
  primary_metric: jaccard_macro

smoke_test:
  max_batches: 1
