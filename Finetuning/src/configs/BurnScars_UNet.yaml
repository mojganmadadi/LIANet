# Hydra config converted from argparse defaults
# Note: choices shown as comments for reference

# This supresses the output folder
# that otherwise is automaticly generated
# by hydra
defaults:
  - _self_  
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  
hydra:  
  output_subdir: null  
  run:  
    dir: .

seed: 42

task: none
model_type: unet
checkpoint_area: none
train_area_bounds: none
weightedSegmentation: False

val_folds: None

logging_directory: /home/user/results_local/finetuning_results_BurnScars
labels_path: masks/BurnScars
# deep learning related
lossfunction: cross_entropy
batchsize: 16
learningrate: 0.00003

num_workers: 8
epochs: 30
warmup_epochs: 0
gpu_id: 7
validate_every_n_epochs: 2
plot_every_n_epochs: 2