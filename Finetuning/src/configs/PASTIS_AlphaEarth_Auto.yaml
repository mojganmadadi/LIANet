experiment_name: pastis_alphaearth
base_train_config: PASTIS_TerraTorch_AlphaEarth

output_root: ./Results/Finetuning_Automated
python_executable: python

tiles: [T31TFJ, T31TFM, T32ULU, T30UXV]
task_template: PASTIS_joint_{tile}
folds: [1]
seeds: [42]

train:
  enabled: true
  skip_existing: true
  pass_val_folds: false
  extra_overrides:
    epochs: 3
    warmup_epochs: 0
    validate_every_n_epochs: 1
    plot_every_n_epochs: 999
    validation_batchsize: 1
    cache_samples: true
    sample_cache_dir: ${oc.env:LIANET_DATA_DIR,/dccstor/geofm-datasets/datasets/lianet_bench}/PASTIS/_lianet_sample_cache
    num_workers: 0
    gpu_id: 0
    checkpoint_metric: jaccard_macro                                                                                                                                                                
    checkpoint_mode: max   
  variants:
    - name: lr1e-4_bs32
      overrides:
        learningrate: 0.0001
        batchsize: 1
        gradient_accumulation_steps: 32
    - name: lr1e-5_bs32
      overrides:
        learningrate: 0.00001
        batchsize: 1
        gradient_accumulation_steps: 32

evaluation:
  enabled: true
  checkpoint_name: best.pt
  batchsize: 1
  num_workers: 0
  include_self_region: false
  device: auto

summary:
  primary_metric: jaccard_macro

smoke_test:
  max_batches: 1