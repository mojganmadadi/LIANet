# TerraMind encoder fine-tuning via TerraTorch EncoderDecoderFactory.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

seed: 42
task: PASTIS_joint_T31TFJ
model_type: terratorch_factory
checkpoint_area: none
train_area_bounds: none
weightedSegmentation: false
val_folds: [3]

logging_directory: ${oc.env:LIANET_DATA_DIR,/dccstor/geofm-datasets/datasets/lianet_bench}/results/LIANet_results/Finetuning
labels_path: masks/PASTIS
lossfunction: cross_entropy
batchsize: 4
gradient_accumulation_steps: 2
learningrate: 0.00003
num_workers: 0
epochs: 10
warmup_epochs: 2
gpu_id: none
validate_every_n_epochs: 2
plot_every_n_epochs: 2

terratorch:
  task: segmentation
  dataset_bands: &s2_bands
    - COASTAL_AEROSOL
    - BLUE
    - GREEN
    - RED
    - RED_EDGE_1
    - RED_EDGE_2
    - RED_EDGE_3
    - NIR_BROAD
    - NIR_NARROW
    - WATER_VAPOR
    - SWIR_1
    - SWIR_2
  model_bands: *s2_bands
  normalization:
    means: [0.1390458, 0.1503317, 0.1718197, 0.1853910, 0.2199100, 0.2779975, 0.2987011, 0.3083234, 0.3132220, 0.3162988, 0.2424884, 0.1857648]
    stds: [0.2106761, 0.2141107, 0.2038973, 0.2134138, 0.2085321, 0.1889926, 0.1820257, 0.1871918, 0.1753829, 0.1797379, 0.1434261, 0.1334311]
  preprocessing:
    scale_factor: 1.0
    offset: 0.1
  freeze_backbone: false
  freeze_decoder: false
  model_args:
    backbone: prithvi_eo_v2_300
    backbone_pretrained: true
    backbone_img_size: 128
    backbone_num_frames: 1
    backbone_bands:
      - COASTAL_AEROSOL
      - BLUE
      - GREEN
      - RED
      - RED_EDGE_1
      - RED_EDGE_2
      - RED_EDGE_3
      - NIR_BROAD
      - NIR_NARROW
      - WATER_VAPOR
      - SWIR_1
      - SWIR_2
    necks:
      - name: SelectIndices
        indices: [5, 11, 17, 23] 
      - name: ReshapeTokensToImage
        remove_cls_token: true
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    head_dropout: 0.1