# One-job automation config for PASTIS UNet baseline cross-region runs.
#
# Default protocol:
#   for each fold and source tile:
#     train PASTIS_joint_<source_tile> with that validation fold held out
#     evaluate the checkpoint on every PASTIS_joint_<target_tile> validation fold
#
# Reduce folds/seeds for smoke tests with overrides, e.g.
#   folds=[3] seeds=[42]

experiment_name: pastis_unet_cross_region
base_train_config: PASTIS_UNet

output_root: ./Results/Finetuning_Automated
python_executable: python

tiles:
  - T31TFJ
  - T31TFM
  - T32ULU
  - T30UXV

task_template: PASTIS_joint_{tile}
folds: [1, 2, 3, 4, 5]
seeds: [42]

train:
  enabled: true
  skip_existing: true
  extra_overrides:
    batchsize: 8
    learningrate: 0.001
    epochs: 10
    warmup_epochs: 2
    validate_every_n_epochs: 2
    plot_every_n_epochs: 999
    num_workers: 8
    gpu_id: 0

evaluation:
  enabled: true
  checkpoint_name: last.pt
  batchsize: 4
  num_workers: 4
  include_self_region: true
  device: auto

summary:
  primary_metric: jaccard_macro

smoke_test:
  max_batches: 1
